name: Supabase migrate

# 本番・ステージングの DB マイグレーションを適用する。
# - 実行は master からの手動実行のみ
# - production は GitHub Environment の保護ルール（Required reviewers）を設定すること
# - 初回だけ `--dry-run` で適用対象を確認し、既存 DB には migration repair で
#   baseline を「適用済み」として記録してから実行する（supabase/README.md 参照）
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - production
          - staging
      action:
        description: "push = apply pending migrations / repair_baseline = mark existing migrations as applied"
        required: true
        type: choice
        options:
          - push
          - repair_baseline
      confirmation:
        description: "repair_baseline のときだけ REPAIR と入力する"
        required: false
        type: string
      dry_run:
        description: Print pending migrations without applying them
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Guard (master only)
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "マイグレーションは master からのみ実行できます。"
            exit 1
          fi

      - name: Verify required settings
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN がありません"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_DB_PASSWORD がありません"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "SUPABASE_PROJECT_REF (Environment variable) がありません"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Build pooler database URL (IPv4)
        run: |
          HOST="${SUPABASE_POOLER_HOST:-}"
          if [ -z "$HOST" ]; then
            RESPONSE=$(curl -fsS \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/database/pooler" || true)
            HOST=$(printf '%s' "$RESPONSE" | jq -r 'if type=="array" then (.[] | select(.pool_mode=="session") | .db_host) else (.db_host // empty) end' 2>/dev/null | head -n1)
          fi

          if [ -z "$HOST" ] || [ "$HOST" = "null" ]; then
            echo "SUPABASE_POOLER_HOST (Environment variable) がありません。"
            echo "Dashboard → Connect → Session pooler のホスト（例: aws-0-xxx.pooler.supabase.com）を設定してください。"
            exit 1
          fi

          echo "Pooler host: $HOST"
          ENCODED_PASSWORD=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          {
            echo "SUPABASE_DB_URL=postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASSWORD}@${HOST}:5432/postgres?sslmode=require"
          } >> "$GITHUB_ENV"

      - name: Repair baseline (existing database only)
        if: ${{ inputs.action == 'repair_baseline' }}
        run: |
          if [ "${{ inputs.confirmation }}" != "REPAIR" ]; then
            echo "confirmation に REPAIR と入力してください。"
            exit 1
          fi

          # 既存 DB にすでにスキーマがある場合だけ実行する。
          # このコマンドは SQL を実行せず、migration 履歴に「適用済み」と記録するだけ。
          VERSIONS=$(ls supabase/migrations | sed 's/_.*//' | tr '\n' ' ')
          if [ -z "$VERSIONS" ]; then
            echo "supabase/migrations にファイルがありません。"
            exit 1
          fi

          echo "適用済みとして記録するバージョン: $VERSIONS"
          supabase migration repair --yes --status applied $VERSIONS \
            --remote="$SUPABASE_DB_URL"

          echo "### Baseline repaired" >> "$GITHUB_STEP_SUMMARY"
          echo "既存のマイグレーションを適用済みとして記録しました。" >> "$GITHUB_STEP_SUMMARY"

      - name: Show pending migrations
        run: |
          supabase db push --yes \
            --remote="$SUPABASE_DB_URL" \
            --dry-run

      - name: Apply migrations
        if: ${{ inputs.action == 'push' && inputs.dry_run == false }}
        run: |
          supabase db push --yes \
            --remote="$SUPABASE_DB_URL"
