name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (new test/config files)
        run: npx eslint tests vitest.config.mts vitest.integration.config.mts vitest.env.mts scripts/supabase-test-env.mjs scripts/run-integration-tests.mjs scripts/db-command.mjs

      - name: Unit tests
        run: npm test

      - name: Start local Supabase
        run: npm run db:start

      - name: Reset local database (migrations + seed)
        run: npx supabase db reset

      - name: Integration tests (local Supabase)
        run: npm run test:integration

      - name: Build (OpenNext / Cloudflare)
        run: npm run build:cf

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup || true
